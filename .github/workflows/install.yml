name: Install

on:
  push:
    branches: [main]
    paths: [scripts/install.sh, scripts/install.ps1, "Nextfix starten.bat", requirements.txt, .github/workflows/install.yml]
  pull_request:
    paths: [scripts/install.sh, scripts/install.ps1, "Nextfix starten.bat", requirements.txt, .github/workflows/install.yml]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXTFIX_START: nein
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh
        if: runner.os != 'Windows'
        run: bash scripts/install.sh && .venv/bin/python -c "import app.web; print('ok')"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -c "import app.web; print('ok')"
      - name: Nextfix starten.bat
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process cmd.exe -ArgumentList '/c', '"Nextfix starten.bat"' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://localhost:8000 | Out-Null; $ok = $true; break }
            catch { Start-Sleep 1 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process uvicorn -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { Write-Host 'Server antwortet nicht'; exit 1 }
          Write-Host 'ok: Nextfix starten.bat startet den Server'
