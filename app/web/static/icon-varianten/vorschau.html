<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Nextfix App-Icon: drei Entwürfe</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
  .bahn { padding: 24px 32px; } .hell { background: #fbf7f8; color: #111827; } .dunkel { background: #0e0e0f; color: #f4f4f5; }
  h1 { font-size: 18px; margin: 0 0 16px; } .zeile { display: flex; align-items: flex-end; gap: 40px; margin-bottom: 24px; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: start; } figcaption { font-size: 12px; opacity: .75; }
  h2 { font-size: 14px; margin: 0 0 8px; }
</style></head><body>
<section class="bahn hell"><h1>Hell</h1></section>
<section class="bahn dunkel"><h1>Dunkel</h1></section>
<script>
  const namen = { 1: "1 Nächste Zeile", 2: "2 N mit Haken", 3: "3 Trichter zur Aufgabe" };
  document.querySelectorAll(".bahn").forEach(b => {
    for (const n of [1, 2, 3]) {
      const z = document.createElement("div");
      z.innerHTML = `<h2>${namen[n]}</h2><div class="zeile">` +
        [16, 32, 64, 180].map(s => `<figure><img src="${n}.svg" width="${s}" height="${s}" alt=""><figcaption>${s} px</figcaption></figure>`).join("") + "</div>";
      b.appendChild(z);
    }
  });
</script></body></html>
